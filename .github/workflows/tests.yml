name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check simhospital_autoconfig tests
      - name: Run pytest
        run: python -m pytest -v

  simulator-validation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out Simhospital
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google/simhospital
          ref: e69eef7de3c01da3f110dda19200f84d7776fb6b
          path: simhospital
      - name: Pin Simhospital Bazel version
        run: echo 5.4.1 > simhospital/.bazelversion
      - name: Declare Simhospital's missing logrus dependency
        run: |
          cat >> simhospital/WORKSPACE <<'EOF'

          # logrus v1.4.2 imports x/sys/unix on Linux, but this dependency is
          # missing from the pinned revision's WORKSPACE.
          go_repository(
              name = "org_golang_x_sys",
              importpath = "golang.org/x/sys",
              version = "v0.0.0-20200930185726-fdedc70b468f",
          )
          EOF
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.29.0
          module-root: simhospital
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run simulator validation
        run: |
          cd simhospital
          bazel build //cmd/simulator:simulator
          simulator_target="$(bazel cquery --output=files //cmd/simulator:simulator | head -n 1)"
          test -n "$simulator_target"
          simulator_binary="$(readlink -f "$simulator_target")"
          test -x "$simulator_binary"
          cp "$simulator_binary" simulator
          cd ..
          make validate-simulator
