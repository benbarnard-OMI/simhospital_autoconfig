name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check simhospital_autoconfig tests
      - name: Run pytest
        run: python -m pytest -v

  simulator-validation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run simulator validation
        # Deliberately does NOT set SIMULATOR_VALIDATION. The GCR image this job
        # used to pull (eu.gcr.io/simhospital-images/simhospital:latest) is no
        # longer publicly available and the job builds no binary, so there is
        # nothing to run here. Setting the variable would turn "cannot validate"
        # into a hard job failure; leaving it unset makes the script emit a
        # ::warning annotation and exit 0. `make validate-simulator` still sets it,
        # so a local run with no simulator available fails loudly instead.
        run: make validate-simulator
